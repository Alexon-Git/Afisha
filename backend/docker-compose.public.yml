# Opt-in extension: docker compose -f docker-compose.yml -f docker-compose.public.yml ...
services:
  public:
    build:
      context: ../public
      args:
        NEXT_PUBLIC_API_BASE: /api
    environment:
      INTERNAL_API_URL: http://backend:8039
    ports:
      - "127.0.0.1:${PUBLIC_PORT:-3001}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - afisha
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 20s
