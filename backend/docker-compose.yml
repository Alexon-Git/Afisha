services:
  db:
    image: postgres:17
    container_name: afisha-db
    environment:
      POSTGRES_USER: afisha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: afisha_db
    volumes:
      - afisha_db_data:/var/lib/postgresql/data
    ports:
      - "5439:5432"
    networks:
      - afisha

  backend:
    build: .
    container_name: afisha-backend
    ports:
      - "8039:8039"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in backend/.env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in backend/.env}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in backend/.env}
    volumes:
      - ./app/static:/app/app/static
      - ./data:/app/data
    command: >
      sh -c "
        python create_admin.py &&
        uvicorn app.main:app --host 0.0.0.0 --port 8039
      "
    depends_on:
      - db
    networks:
      - afisha

networks:
  afisha:
    name: afisha

volumes:
  afisha_db_data:
    name: afisha_db_data


