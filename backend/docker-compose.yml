services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: afisha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: afisha_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afisha -d afisha_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - afisha_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5439}:5432"
    networks:
      - afisha
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # Match the deployment user's ownership of the uploads bind mount.
    user: "${BACKEND_UID:-1000}:${BACKEND_GID:-1000}"
    init: true
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8039}:8039"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in backend/.env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in backend/.env}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      LOGIN_ACCOUNT_LIMIT: ${LOGIN_ACCOUNT_LIMIT:-5}
      LOGIN_SOURCE_LIMIT: ${LOGIN_SOURCE_LIMIT:-30}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-900}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in backend/.env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@afisha.ru}
    volumes:
      - type: bind
        source: ${UPLOADS_PATH:-./app/static/uploads}
        target: /app/app/static/uploads
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 20s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - afisha

networks:
  afisha:

volumes:
  afisha_db_data:
    # Preserve the existing production volume by default. Tests and parallel
    # projects must set a unique POSTGRES_VOLUME_NAME.
    name: ${POSTGRES_VOLUME_NAME:-afisha_db_data}


