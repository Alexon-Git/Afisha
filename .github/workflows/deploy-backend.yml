name: Deploy Backend

on:
  push:
    branches: [  ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies (backend lint/test)
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Prepare ssh tools
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Sync backend files to server
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          # Copy backend folder (excluding local data)
          sshpass -p "$PASSWORD" rsync -av --delete --exclude 'data' -e "ssh -o StrictHostKeyChecking=no" backend/ $USERNAME@$HOST:/var/www/alexon/Afisha/backend/

      - name: Restart backend (docker-compose)
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          sshpass -p "$PASSWORD" ssh -o StrictHostKeyChecking=no $USERNAME@$HOST "cd /var/www/alexon/Afisha/backend && docker compose down || true && docker compose up -d --build"
