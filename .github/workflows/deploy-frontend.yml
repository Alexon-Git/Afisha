name: Deploy Frontend

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (frontend)
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Prepare ssh tools
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Copy frontend build to server
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          # Ensure target directory exists
          sshpass -p "$PASSWORD" ssh -o StrictHostKeyChecking=no $USERNAME@$HOST "mkdir -p /var/www/alexon/Afisha/frontend && sudo chown $USERNAME:$USERNAME /var/www/alexon/Afisha/frontend || true"
          # Upload build artifacts (use rsync for speed and delete removed files)
          sshpass -p "$PASSWORD" rsync -av --delete -e "ssh -o StrictHostKeyChecking=no" frontend/build/ $USERNAME@$HOST:/var/www/alexon/Afisha/frontend/

      - name: Reload nginx
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          sshpass -p "$PASSWORD" ssh -o StrictHostKeyChecking=no $USERNAME@$HOST 'sudo systemctl reload nginx || true'
