name: Application checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: afisha_pr8
          POSTGRES_USER: pr8_test
          POSTGRES_PASSWORD: ci-only-isolated-pr8-password
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U pr8_test -d afisha_pr8"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python syntax
        working-directory: backend
        run: python -m compileall -q app alembic
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q
      - name: Check PostgreSQL 17 migration and time contract in four timezones
        working-directory: backend
        env:
          AFISHA_PR8_TEST_DATABASE_URL: postgresql://pr8_test:ci-only-isolated-pr8-password@127.0.0.1:5432/afisha_pr8
        run: python -m pytest -q tests/test_event_time_contract.py -k postgresql

  admin-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      PUBLIC_URL: /admin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test -- --watchAll=false --runInBand
      - run: npm run build

  public-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: public
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE: /api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: public/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke

  gateway-smoke:
    needs: [backend-tests, admin-tests, public-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check Docker and Compose
        run: |
          docker version
          docker compose version
      - name: Test runner isolation
        run: |
          python -m unittest discover -s public/tests -p test_compose_isolation.py -v
          python -m unittest discover -s deploy/tests -p test_gateway_isolation.py -v
      - name: Build and smoke FastAPI, Next.js and Nginx with CRA
        run: bash deploy/tests/gateway-smoke.sh --context default
