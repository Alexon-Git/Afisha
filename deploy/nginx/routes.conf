client_max_body_size 6m;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header Connection "";
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Forwarded "";
proxy_set_header X-Real-IP "";
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-Port "";
proxy_hide_header X-Powered-By;
proxy_hide_header Server;
proxy_cache off;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;

location = /admin { return 308 /admin/$is_args$args; }
location ^~ /admin/static/ {
    include /etc/nginx/afisha/admin-access.conf;
    root /srv;
    try_files $uri =404;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location /admin/ {
    include /etc/nginx/afisha/admin-access.conf;
    root /srv;
    try_files $uri /admin/index.html;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
}
location = /api { return 308 /api/$is_args$args; }
location = /api/auth/login {
    include /etc/nginx/afisha/admin-access.conf;
    proxy_pass http://backend:8039/auth/login;
    proxy_hide_header Cache-Control;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
}
location /api/ {
    proxy_pass http://backend:8039/;
    # FastAPI slash redirects must retain the external /api prefix.
    proxy_redirect ~^https?://[^/]+(/.*)$ /api$1;
    proxy_hide_header Cache-Control;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
}
location ^~ /static/uploads/ {
    if ($uri !~* "\.(jpg|jpeg|png|webp)$") { return 404; }
    alias /srv/uploads/;
    disable_symlinks on;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=3600";
}
location / {
    proxy_pass http://public:3000;
    proxy_buffering off;
}
