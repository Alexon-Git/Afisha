server {
    listen 80;
    server_name afisha.example.com; # replace with your domain

    root /var/www/alexon/Afisha/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve static files
    # Serve uploaded static files from backend (uploads)
    location /static/uploads/ {
        # files uploaded by backend
        alias /var/www/alexon/Afisha/backend/app/static/uploads/;
        access_log off;
        expires 30d;
    }

    # Serve other frontend static files
    location /static/ {
        alias /var/www/alexon/Afisha/frontend/static/;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://127.0.0.1:8039/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8039/health;
    }

    error_log /var/log/nginx/afisha-error.log;
    access_log /var/log/nginx/afisha-access.log;
}
